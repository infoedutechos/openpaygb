# Publishes the static documentation hub (docs/) to GitHub Pages.
#
# One-time repo setup (required — GITHUB_TOKEN cannot create the Pages site):
#   GitHub → Settings → Pages → Build and deployment → Source: "GitHub Actions"
#   https://github.com/infoedutechos/ODELHUBPay/settings/pages
#
# Until that is done, the deploy job is skipped and this workflow stays green.

name: Deploy documentation site

on:
  push:
    branches: [main, master]
    paths:
      - "docs/**"
      - ".github/workflows/docs-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-docs
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.pages_site.outputs.ready }}
    steps:
      - name: Check GitHub Pages site exists
        id: pages_site
        run: |
          code=$(curl -sS -o /tmp/pages.json -w "%{http_code}" \
            -H "Authorization: Bearer ${{ github.token }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/pages")
          if [ "$code" = "200" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::warning::GitHub Pages is not enabled for this repository."
            echo "::warning::Enable once: Settings → Pages → Build and deployment → Source: GitHub Actions."
            echo "::warning::https://github.com/${{ github.repository }}/settings/pages"
          fi

  deploy:
    needs: check
    if: needs.check.outputs.ready == 'true'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deployment
        uses: actions/deploy-pages@v4
