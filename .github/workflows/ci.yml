name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    env:
      # Prisma validate/build only need a syntactically valid URL in CI (no live DB).
      DATABASE_URL: mongodb://ci:ci@127.0.0.1:27017/odelhub_pay_ci?directConnection=true
      JWT_SECRET: ci-jwt-secret-minimum-32-characters-long
      NEXT_PUBLIC_APP_URL: https://odelpay.vercel.app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --no-audit --no-fund
      - run: npx prisma validate
      - run: npm run lint
      - run: npm run test
      - run: npx tsc --noEmit
      - run: npm run build
